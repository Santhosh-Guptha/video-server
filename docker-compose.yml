version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vms-postgres
    environment:
      POSTGRES_USER: vms_admin
      POSTGRES_PASSWORD: vms_secure_password
      POSTGRES_DB: vms_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms_admin -d vms_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: vms-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: vms-mediamtx
    ports:
      - "8554:8554"  # RTSP Ingress/Egress
      - "1935:1935"  # RTMP Push Ingress
      - "8080:8080"  # HLS Egress
      - "8889:8889"  # WebRTC (WHEP/WHIP) Egress/Ingress
      - "9997:9997"  # REST API Port
    volumes:
      - ./backend/app/mediamtx.yml:/mediamtx.yml:ro
      - /opt/video-server/backend/data:/app/data  # Mount shared recordings folder
    depends_on:
      - redis
    restart: always

  coturn:
    image: coturn/coturn:latest
    container_name: vms-coturn
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --user=vms_user:vms_turn_password
      - --realm=vms.local
    restart: always

  backend:
    build: ./backend
    container_name: vms-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://vms_admin:vms_secure_password@postgres:5432/vms_db
      - REDIS_URL=redis://redis:6379/0
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - MEDIAMTX_WEBRTC_URL=http://mediamtx:8889
    ports:
      - "8005:8000"
    volumes:
      - ./backend:/app
      - /opt/video-server/backend/data:/app/data  # Mount data recordings/db on host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
    restart: always

volumes:
  pgdata:
  redisdata:
