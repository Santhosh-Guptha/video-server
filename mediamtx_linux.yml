# MediaMTX v1.21 configuration template. Run from the backend directory.
# The unattended installer generates deployment-specific addresses and paths.
logLevel: info
api: yes
apiAddress: 127.0.0.1:9997
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: yes
rtmpAddress: :1935
hls: yes
hlsAddress: :8080
hlsVariant: lowLatency
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8000
webrtcAdditionalHosts: [localhost, 127.0.0.1]
webrtcICEServers2: []
moq: no
pathDefaults:
  rtspTransport: tcp
  record: yes
  recordPath: ./data/recordings/%path/%Y-%m-%d/%Y%m%d_%H%M%S_live
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 60s
  runOnRecordSegmentComplete: /bin/bash ./app/segment_hook.sh "$MTX_PATH" "$MTX_SEGMENT_PATH"
paths:
  all_others:
    source: publisher
