# MediaMTX configuration

# Enable API for dynamic path management
api: yes
apiAddress: :9997

# Log level
logLevel: warn

# RTSP server settings (Ingress and Egress)
rtsp: yes
rtspAddress: :8554
protocols: [udp, multicast, tcp]

# RTMP server settings (Edge push ingress)
rtmp: yes
rtmpAddress: :1935

# HLS server settings (Browser compatibility fallback)
hls: yes
hlsAddress: :8080
hlsVariant: lowLatency
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

# WebRTC server settings (WHEP / WHIP live viewing)
webrtc: yes
webrtcAddress: :8889
webrtcICEServers2:
  - url: "stun:stun.l.google.com:19302"

# Recording settings
# We enable recording on paths. Each dynamic stream will configure its record option.
# By default, we write fragmented MP4 files matching the indexer folder structure.
pathDefaults:
  record: yes
  recordPath: "/mnt/c/Users/santhosh/Downloads/vs/camera_video_platform_fullstack/backend/data/recordings/%path/%Y-%m-%d/%Y%m%d_%H%M%S_recovered"
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 60s
  runOnRecordSegmentComplete: |
    cd /opt/video-server/backend && /opt/video-backend-venv/bin/python3 -m app.record_complete "${MTX_PATH:-$RTSP_PATH}" "${MTX_SEGMENT_PATH:-$RECORD_PATH}"

# Configuration for paths
paths:
  # Enable a default path configuration for publishers
  # This allows edge clients to push streams dynamically without prior path registration if needed.
  all_others:
    source: publisher
    record: yes
